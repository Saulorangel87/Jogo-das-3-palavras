server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 512;

  types {
    application/manifest+json webmanifest;
  }
  include /etc/nginx/mime.types;

  # Arquivos com hash no nome nunca mudam: cache longo.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/seguranca.inc;
  }

  # O navegador precisa revalidar estes para descobrir versão nova do jogo.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/seguranca.inc;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    include /etc/nginx/seguranca.inc;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/seguranca.inc;
  }

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/seguranca.inc;
  }

  # Arquivo que não existe é 404: nunca devolver a página do jogo no lugar dele.
  location / {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/seguranca.inc;
  }
}
