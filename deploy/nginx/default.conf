server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # 'unsafe-inline' e data: porque o plugin legado do Vite injeta scripts de detecção de recursos; o React usa style inline.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # Arquivos com hash no nome nunca mudam: cache longo.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # A página principal sempre revalidada, para pegar versão nova do jogo.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }

  # Sem favicon .ico: responde vazio em vez de devolver a página do jogo.
  location = /favicon.ico {
    access_log off;
    return 204;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
