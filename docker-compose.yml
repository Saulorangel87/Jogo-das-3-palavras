# Produção: 3palavras.devsaulo.com.br
# A porta fica presa ao IP do Tailscale da VPS; o Cloudflare Tunnel
# ("Server Oracle") entrega o tráfego público a ela.
services:
  tres-palavras:
    build: .
    image: tres-palavras:latest
    container_name: tres-palavras
    restart: unless-stopped
    # Site estático: o Nginx não precisa de root, de privilégios nem de gravar no disco.
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0755
      - /run:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      tres-palavras-online:
        condition: service_healthy
    ports:
      - "100.67.151.30:8810:8080"

  # Servidor do modo online. Sem porta publicada: só o Nginx acima fala com ele.
  # Não grava nada: as salas ficam na memória.
  tres-palavras-online:
    build:
      context: .
      dockerfile: servidor/Dockerfile
    image: tres-palavras-online:latest
    container_name: tres-palavras-online
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ORIGENS: https://3palavras.devsaulo.com.br
